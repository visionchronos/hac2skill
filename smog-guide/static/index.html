<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmogGuide – air pollution advice for Indian families" />
    <title>SmogGuide</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <h1>SmogGuide</h1>
      <p>Air quality guidance for your family</p>
    </header>

    <main id="main-content">
      <section aria-labelledby="form-heading">
        <h2 id="form-heading">Get personalised advice</h2>

        <form id="advice-form" novalidate>
          <div class="field">
            <label for="location">Your location</label>
            <input
              id="location"
              name="location"
              type="text"
              required
              maxlength="200"
              placeholder="e.g. Delhi, Punjabi Bagh"
              autocomplete="address-level2"
            />
          </div>

          <fieldset>
            <legend>Household members</legend>
            <label class="checkbox-label">
              <input type="checkbox" name="has_children" />
              Children
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="has_elderly" />
              Elderly members
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="has_asthma" />
              Asthma or lung condition
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="has_heart_condition" />
              Heart condition
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="has_pregnant" />
              Pregnant member
            </label>
          </fieldset>

          <button type="submit">Get advice</button>
        </form>
      </section>

      <section id="results-section" aria-live="polite" aria-atomic="true" hidden>
        <h2>Recommendations</h2>
        <div id="results-container"></div>
      </section>
    </main>

    <footer>
      <p>Estimates are general guidance, not medical advice. Always consult a doctor for health concerns.</p>
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
